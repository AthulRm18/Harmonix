# EngineSense Docker Compose
# `make demo` brings up the whole system with seeded data.

services:
  # ── PostgreSQL + TimescaleDB ─────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: enginesense
      POSTGRES_USER: enginesense
      POSTGRES_PASSWORD: enginesense_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enginesense"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENGINESENSE_DATABASE_URL: "postgresql+asyncpg://enginesense:enginesense_dev@db:5432/enginesense"
      ENGINESENSE_BLOB_STORE_ROOT: "/data/blobs"
      ENGINESENSE_MLFLOW_TRACKING_URI: "sqlite:///data/mlflow.db"
      ENGINESENSE_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - blobdata:/data/blobs
      - mlflowdata:/data
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      - api

  # ── MLflow Tracking Server ──────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow

volumes:
  pgdata:
  blobdata:
  mlflowdata:
